name: Release

# Builds the app and the installer on Windows and publishes them as a GitHub
# release whenever a version tag such as v1.0.0 is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test -c Release

      - name: Version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build app
        run: dotnet publish src/DareuMouse -c Release -o dist -p:Version=${{ env.VERSION }}

      - name: Build installer
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
          }
          & $makensis /DVERSION=$env:VERSION installer\DareuMouse.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "dist\DareuMouse-Setup-$env:VERSION.exe"
          $hashes = Get-FileHash dist\DareuMouse.exe, $setup -Algorithm SHA256 |
            ForEach-Object { "- ``$(Split-Path $_.Path -Leaf)``: ``$($_.Hash.ToLower())``" }
          $notes = @"
          **Instalar:** descarga ``DareuMouse-Setup-$env:VERSION.exe`` y ábrelo. No pide permisos de administrador.
          **Sin instalar:** descarga ``DareuMouse.exe`` y ábrelo desde una carpeta fija.

          Windows SmartScreen puede avisar porque los archivos no están firmados: elige Más información → Ejecutar de todas formas.

          SHA-256:
          $($hashes -join "`n")
          "@
          gh release create "${{ github.ref_name }}" $setup dist\DareuMouse.exe `
            --title "Dareu Mouse $env:VERSION" --notes $notes
